<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 字符编码：UTF-8，保证中文正常显示 -->
    <meta charset="UTF-8">
    <!-- 视口设置：适配移动端，防止页面缩放变形 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人名片 - 张三</title>
    <!-- 引入外部样式表，实现结构与样式分离 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== 名片卡片容器 ===== -->
    <div class="card">

        <!-- 圆形头像：此处使用内嵌 SVG 作为占位图，
             替换为真实照片时，将 src 改为图片路径即可，例如 src="avatar.jpg" -->
        <img class="avatar"
             src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' fill='%234a90d9'/%3E%3Ccircle cx='60' cy='46' r='20' fill='%23ffffff'/%3E%3Cellipse cx='60' cy='102' rx='34' ry='26' fill='%23ffffff'/%3E%3C/svg%3E"
             alt="个人头像">

        <!-- 姓名 -->
        <h1 class="name">张三</h1>global user.name  aran came

        <!-- 职位 -->
        <p class="title">前端开发工程师</p>

        <!-- 分割线：视觉上区分个人信息与联系方式 -->
        <div class="divider"></div>

        <!-- 联系方式列表 -->
        <ul class="contact">
            <!-- 电话 -->
            <li>📞 138-0000-0000</li>
            <!-- 邮箱 -->
            <li>✉️ zhangsan@example.com</li>
            <!-- 地址 -->
            <li>📍 北京市朝阳区</li>
        </ul>

    </

</body>
</html>
